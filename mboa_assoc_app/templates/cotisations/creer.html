{% extends 'base_with_sidebar.html' %}

{% block title %}Créer une cotisation - {{ association.name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="max-w-2xl mx-auto">
    <div class="card">
      <div class="card-header">
        <h1 class="text-2xl font-bold">Créer une cotisation</h1>
        <p class="text-muted">{{ association.name }}</p>
      </div>

      <div class="card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="type_cotisation" class="form-label">Type de cotisation</label>
            <input type="text" id="type_cotisation" name="type_cotisation" class="form-input"
              placeholder="Ex: Cotisation mensuelle, Événement spécial..." required>
          </div>

          <div class="form-group">
            <label for="montant" class="form-label">Montant (FCFA)</label>
            <input type="number" id="montant" name="montant" class="form-input" placeholder="5000" min="100" step="100"
              required>
          </div>

          <div class="form-group">
            <label for="date_echeance" class="form-label">Date d'échéance</label>
            <input type="date" id="date_echeance" name="date_echeance" class="form-input"
              value="{{ date_defaut|date:'Y-m-d' }}" required>
          </div>

          <div class="flex gap-3 mt-6">
            <button type="submit" class="btn btn-primary flex-1">
              <i class="fa-solid fa-check"></i>
              Créer la cotisation
            </button>
            <a href="{% url 'mboa_assoc_app:liste_cotisations' association.id %}" class="btn btn-secondary">
              <i class="fa-solid fa-times"></i>
              Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
