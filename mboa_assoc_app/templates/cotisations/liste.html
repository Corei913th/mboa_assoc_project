<!-- Liste des cotisations -->
 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des cotisations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Liste des cotisations</h2>
        <a href="{% url 'mboa_assoc_app:cotisation_create' %}" class="btn btn-primary">
            ➕ Nouvelle cotisation
        </a>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
            <tr>
                <th>Nom</th>
                <th>Montant</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for cotisation in cotisations %}
            <tr>
                <td>{{ cotisation.nom }}</td>
                <td>{{ cotisation.montant }} FCFA</td>
                <td>
                    <a href="{% url 'mboa_assoc_app:cotisation_detail' cotisation.id %}" class="btn btn-sm btn-info">
                        Voir
                    </a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">
                    Aucune cotisation enregistrée
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
