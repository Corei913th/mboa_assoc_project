<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une cotisation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4>Créer une cotisation</h4>
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    {{ form.nom.label_tag }}
                    {{ form.nom }}
                </div>

                <div class="mb-3">
                    {{ form.montant.label_tag }}
                    {{ form.montant }}
                </div>

                <button type="submit" class="btn btn-success">
                    💾 Enregistrer
                </button>
                <a href="{% url 'mboa_assoc_app:cotisation_list' %}" class="btn btn-secondary">
                    Annuler
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
