<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail cotisation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4>Détails de la cotisation</h4>
        </div>

        <div class="card-body">
            <p><strong>Nom :</strong> {{ cotisation.nom }}</p>
            <p><strong>Montant :</strong> {{ cotisation.montant }} FCFA</p>
        </div>

        <div class="card-footer text-end">
            <a href="{% url 'mboa_assoc_app:cotisation_list' %}" class="btn btn-secondary">
                ⬅ Retour à la liste
            </a>
        </div>
    </div>
</div>

</body>
</html>
