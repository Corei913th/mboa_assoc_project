{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#10b981">
  <meta name="description" content="Plateforme de gestion des associations camerounaises">
  <title>{% block title %}Mboa Asso{% endblock %}</title>

  <!-- Tailwind CSS (compilé) -->
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">

  <!-- Font Awesome (local) -->
  <link rel="stylesheet" href="{% static 'css/fontawesome-custom.css' %}">
  <link rel="stylesheet" href="{% static 'css/fontawesome-icons.min.css' %}">

  <!-- Design System -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/icons.css' %}">

  {% block extra_css %}{% endblock %}
</head>

<body>
  {% block content %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>

</html>
