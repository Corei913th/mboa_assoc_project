{% comment %}Modal: Créer une Cotisation{% endcomment %}
<div id="creerCotisationModal" class="modal-overlay hidden">
  <div class="modal-container" onclick="event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Créer une Cotisation</h3>
        <button type="button" class="modal-close" onclick="closeModal('creerCotisationModal')">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <form method="POST" action="{% url 'mboa_assoc_app:creer_cotisation' association.id %}?next=dashboard">
        {% csrf_token %}
        <div class="modal-body space-y-4">
          {% for field in form %}
          <div class="form-group">
            <label for="{{ field.id_for_label }}" class="form-label">
              {{ field.label }}{% if field.field.required %} *{% endif %}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-error text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
          {% endfor %}
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal('creerCotisationModal')" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>
