{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title|default:"Association" }}{% endblock %} - Mboa Assoc</title>
    
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="{% static 'associations/css/associations.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Messages flash -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <!-- Contenu principal -->
    <main class="container" style="padding-top: 32px; padding-bottom: 32px;">
        {% block content %}{% endblock %}
    </main>
    
    <!-- JavaScript -->
    <script src="{% static 'associations/js/forms.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
